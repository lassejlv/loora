<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loora</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#fafafa" />
    <!-- Self-hosted, and byte-identical to what the web app loads. -->
    <link rel="stylesheet" href="/vendor/fonts.css" />
    <script>
      // Dark before first paint, so the window never flashes white on the way
      // in. The full restore — custom themes, interface scale — happens in
      // `@loora/shell/lib/theme` once React is running; this is only the part
      // that has to be done before there is anything to see.
      try {
        var stored = localStorage.getItem('loora:theme')
        document.documentElement.classList.toggle(
          'dark',
          stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches),
        )
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
